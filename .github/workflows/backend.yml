name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_call:  # reused as the test gate by deploy.yml

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: didar
          POSTGRES_PASSWORD: didar
          POSTGRES_DB: didar
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U didar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app
      - name: Architecture contract (import-linter)
        run: lint-imports
      - name: Tests
        # Coverage floor: measured 91% at introduction; gate set 2 points below
        # so it catches regressions without flaking on refactors. Local runs
        # stay plain `pytest` (fast, no coverage).
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=89
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://didar:didar@localhost:5434/didar_test
      # The suite builds its schema with create_all, so migrations themselves are
      # otherwise untested — this catches fresh-install breakers (e.g. the 0019
      # enum-in-same-transaction bug) before they reach a real deploy.
      - name: Migrations on a fresh DB
        run: |
          PGPASSWORD=didar psql -h localhost -p 5434 -U didar -c 'CREATE DATABASE didar_migrate;'
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://didar:didar@localhost:5434/didar_migrate
