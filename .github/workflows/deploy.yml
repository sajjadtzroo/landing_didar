name: deploy

# VPS deployment via a self-hosted runner ON the server (label: didar-vps).
# Inert until the repo variable DEPLOY_ENABLED is set to 'true' — without a
# registered runner the jobs are skipped, never queued.
#
# Flow: push to main -> backend test gate (reused workflow) -> build + up on
# the VPS itself (no image registry involved — matters on Iranian networks).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  test:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/backend.yml

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: [self-hosted, didar-vps]
    env:
      # Every deploy is an addressable image; rollback =
      #   IMAGE_TAG=<old-sha> docker compose ... up -d --no-build
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Prep host dirs (backups volume mount)
        # 0700: dumps contain customer PII + admin password hashes.
        run: mkdir -p /opt/didar/backups && chmod 700 /opt/didar/backups

      - name: Build images on the server
        run: >
          docker compose -p didar
          -f docker-compose.yml -f docker-compose.prod.yml
          --env-file /opt/didar/.env build

      - name: Tag as latest (rollback pointer stays per-SHA)
        run: |
          docker tag didar-backend:$IMAGE_TAG didar-backend:latest
          docker tag didar-frontend:$IMAGE_TAG didar-frontend:latest

      - name: Roll the stack
        run: >
          docker compose -p didar
          -f docker-compose.yml -f docker-compose.prod.yml
          --env-file /opt/didar/.env up -d --remove-orphans

      - name: Smoke test (through Caddy — app ports are not published)
        run: |
          DOMAIN=$(grep '^DOMAIN=' /opt/didar/.env | cut -d= -f2)
          for i in $(seq 1 12); do
            sleep 5
            if curl -fsS "https://api.$DOMAIN/health" > /dev/null 2>&1; then break; fi
          done
          curl -fsS "https://api.$DOMAIN/health"
          curl -fsS "https://api.$DOMAIN/ready"
          curl -fsS -o /dev/null "https://$DOMAIN/"
          echo "smoke OK"

      - name: Prune dangling images (tagged per-SHA images are kept for rollback)
        run: |
          docker image prune -f
          # keep only the 5 newest per-SHA tags per image
          for img in didar-backend didar-frontend; do
            docker images "$img" --format '{{.Tag}} {{.CreatedAt}}' \
              | grep -v '^latest\|^dev' | sort -rk2 | awk 'NR>5{print $1}' \
              | xargs -r -n1 -I{} docker rmi "$img:{}" || true
          done
