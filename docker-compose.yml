# Bounded container logs: without this the json-file driver grows forever and
# fills the disk. The observability stack (observability/) tails these files.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# One env block, two consumers: the API and the one-shot `migrate` service
# (migrations/seed need the same settings the app boots with).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://didar:didar@db:5432/didar
  # Shared cache + exact cross-worker rate limits. Blank = in-process mode.
  REDIS_URL: redis://redis:6379/0
  FRONTEND_ORIGIN: http://localhost:3001
  # Dev defaults — override in a real .env. admin/admin123 hash below.
  ADMIN_USERNAME: admin
  # Dev bootstrap: entrypoint hashes this at boot. Prod: set ADMIN_PASSWORD_HASH.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  COOKIE_SECURE: "false"
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  SMS_SENDER: ${SMS_SENDER:-}
  PAYAMSMS_SYSTEM_NAME: ${PAYAMSMS_SYSTEM_NAME:-}
  PAYAMSMS_USERNAME: ${PAYAMSMS_USERNAME:-}
  PAYAMSMS_PASSWORD: ${PAYAMSMS_PASSWORD:-}
  PAYAMSMS_CLIENT_ID: ${PAYAMSMS_CLIENT_ID:-}
  PAYAMSMS_CLIENT_SECRET: ${PAYAMSMS_CLIENT_SECRET:-}
  # Structured logs for the observability stack (human-readable if false).
  LOG_JSON: ${LOG_JSON:-true}
  APP_ENV: dev
  ADMIN_ORDER_BASE_URL: http://localhost:3001/admin/orders
  # MinIO object storage (values from the gitignored root .env). Empty →
  # falls back to LocalStorage, so the stack still runs without them.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-}
  MINIO_SECURE: ${MINIO_SECURE:-true}

services:
  db:
    <<: *default-logging
    image: postgres:16-alpine
    # Observability: slow queries (>200ms), lock waits and checkpoints to stdout
    # (picked up by the log collector); pg_stat_statements for query-level stats
    # (run once: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;)
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=200
      -c log_lock_waits=on
      -c log_checkpoints=on
      -c log_autovacuum_min_duration=1000
      -c log_line_prefix='%m [%p] %q%u@%d '
    environment:
      POSTGRES_USER: didar
      POSTGRES_PASSWORD: didar
      POSTGRES_DB: didar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didar"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"   # 5432 often taken by another local pg; container-internal port unchanged

  redis:
    # Cache + shared rate limits only — nothing durable lives here (Postgres is
    # the source of truth), so no volume/persistence; LRU-evict under pressure.
    image: redis:7-alpine
    <<: *default-logging
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6381:6379"   # 6379/6380 taken by other local stacks

  # One-shot: `alembic upgrade head` + idempotent seed, exactly once per
  # `up`, BEFORE the API starts. Keeping this out of the backend entrypoint
  # means N workers/replicas can never race the same migration.
  migrate:
    build: ./backend
    image: didar-backend:dev
    <<: *default-logging
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    command: sh -c "alembic upgrade head && python -m app.seed"

  backend:
    build: ./backend
    image: didar-backend:dev
    <<: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    volumes:
      - media:/app/media
    ports:
      - "8001:8000"   # 8000 taken by another local stack

  frontend:
    build: ./frontend
    image: didar-frontend:dev
    <<: *default-logging
    depends_on:
      - backend
    environment:
      # Server-side calls go container→container; browser calls go to localhost.
      NUXT_PUBLIC_API_BASE: http://localhost:8001/api/v1
      NUXT_API_BASE_INTERNAL: http://backend:8000/api/v1
      # First-party path — proxied to Mautic by server/routes/mtc/[...].ts so
      # tracking cookies are first-party. Upstream set via NUXT_MAUTIC_ORIGIN.
      NUXT_PUBLIC_MAUTIC_URL: ${MAUTIC_URL:-/mtc}
      NUXT_MAUTIC_ORIGIN: ${MAUTIC_ORIGIN:-https://marketing-auto.liara.run}
      NUXT_PUBLIC_MATOMO_URL: ${MATOMO_URL:-}
      NUXT_PUBLIC_MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
    ports:
      - "3001:3000"   # 3000 taken by another local stack

volumes:
  pgdata:
  media:
