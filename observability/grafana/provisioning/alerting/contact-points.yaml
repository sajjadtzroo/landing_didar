apiVersion: 1

contactPoints:
  - orgId: 1
    name: team-telegram
    receivers:
      - uid: telegram-didar
        type: telegram
        settings:
          # Set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in the compose env.
          # Empty token = alerts fire but deliveries fail silently — check
          # Alerting > Contact points after first boot.
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "${TELEGRAM_CHAT_ID}"

policies:
  - orgId: 1
    receiver: team-telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
