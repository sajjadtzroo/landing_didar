global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI /metrics (aggregated across gunicorn workers via multiproc mode).
  - job_name: didar-backend
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: didar-api

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
