[project]
name = "didar-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async bridges via greenlet; without this, post-`await` lines in
# every endpoint read as uncovered.
concurrency = ["greenlet", "thread"]
omit = ["app/seed.py"]  # boot-time CLI script, not request-path code

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Persian seed copy and long connection-string defaults read fine over 88 cols.
"app/seed.py" = ["E501"]
"app/core/config.py" = ["E501"]
# Pre-existing long lines (mostly Persian copy / query builders), carried through
# the domain migration untouched. Burn down opportunistically, then delete lines.
"app/core/content_defaults.py" = ["E501"]
"app/core/db.py" = ["E501"]
"app/main.py" = ["E501"]
"app/domains/catalog/services/import_service.py" = ["E501"]
"app/domains/catalog/services/minio_import.py" = ["E501"]
"app/domains/catalog/models/import_job.py" = ["E501"]
"app/domains/catalog/routers/admin.py" = ["E501"]
"app/domains/content/router_admin_portfolios.py" = ["E501"]
"app/domains/serials/router_admin.py" = ["E501"]
"app/domains/serials/router_admin_buybacks.py" = ["E501"]
"app/domains/serials/router_public.py" = ["E501"]
"app/domains/serials/serial_models.py" = ["E501"]
"app/domains/serials/warranty_models.py" = ["E501"]

# Architecture contract (G2/G8): run `lint-imports` locally and in CI
# (.github/workflows/backend.yml). Structure: docs/architecture/02-domain-map.md.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Framework layering: domains -> shared -> core, never the reverse"
type = "layers"
layers = ["app.domains", "app.shared", "app.core"]

[[tool.importlinter.contracts]]
name = "Domain DAG (02-domain-map.md) — documented upward exceptions"
type = "layers"
containers = ["app.domains"]
layers = [
  "agents",
  "dashboard",
  "chat",
  "serials",
  "orders",
  "customers",
  "content",
  "catalog",
  "pricing",
  "users",
]
ignore_imports = [
  "app.domains.orders.actions.order_action -> app.domains.serials.service",
  "app.domains.customers.routers.account -> app.domains.orders",
  "app.domains.customers.queries.customer_query -> app.domains.orders",
  "app.domains.users.queries.user_query -> app.domains.agents",
  "app.domains.users.actions.user_action -> app.domains.agents",
]

[[tool.importlinter.contracts]]
name = "chat: internals only via the domain public API"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.domains.agents",
  "app.domains.dashboard",
  "app.domains.serials",
  "app.domains.orders",
  "app.domains.customers",
  "app.domains.content",
  "app.domains.catalog",
  "app.domains.pricing",
  "app.domains.users",
]
forbidden_modules = [
  "app.domains.chat.models",
  "app.domains.chat.schemas",
  "app.domains.chat.service",
  "app.domains.chat.realtime",
  "app.domains.chat.router",
  "app.domains.chat.router_admin",
  "app.domains.chat.router_ws",
]

[[tool.importlinter.contracts]]
name = "agents: internals only via the domain public API"
